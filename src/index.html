<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>outpost</title>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --link: #0a64d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #ececee; --muted: #9a9aa0; --link: #6aa8ff; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .75rem; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>outpost</h1>
  <p>The relay for NESER network play. It carries the game between two players whose networks
    cannot connect directly; there is nothing to do here.</p>
  <p>To play, open <a href="https://neser.rmstdope.eu">NESER</a>.</p>
</main>
</body>
</html>
